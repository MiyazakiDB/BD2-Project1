<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busqueda por similitud de texto</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .demo-container {
            padding: 2rem;
        }
        
        .header-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            text-align: center;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stats-card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stats-card:hover {
            transform: translateY(-5px);
        }
        
        .search-card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .search-input {
            border-radius: 25px;
            border: 2px solid #e9ecef;
            padding: 15px 25px;
            font-size: 1.1rem;
        }
        
        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
        }
        
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .result-card {
            border-radius: 15px;
            border: none;
            border-left: 4px solid #667eea;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }
        
        .result-card:hover {
            transform: translateY(-3px);
        }
        
        .similarity-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            background: rgba(255,255,255,0.8);
            transition: background 0.3s ease;
        }
        
        .upload-area:hover {
            background: rgba(255,255,255,0.9);
        }
        
        .loading {
            display: none;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <!-- Header -->
        <div class="header-card">
            <h1 class="display-4 mb-3">
                <i class="fas fa-database me-3"></i>
                Busqueda por similitud de texto
            </h1>
            <p class="lead mb-0">
                Indexación de documentos y búsqueda de similitud alimentada por TF-IDF
            </p>
        </div>

        <!-- Stats Row -->
        <div class="row mb-4" id="statsRow">
            <div class="col-md-3">
                <div class="stats-card card">
                    <div class="card-body text-center">
                        <i class="fas fa-file-alt fa-2x text-primary mb-2"></i>
                        <h4 class="mb-1" id="totalDocs">0</h4>
                        <small class="text-muted">Documentos</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card card">
                    <div class="card-body text-center">
                        <i class="fas fa-chart-bar fa-2x text-success mb-2"></i>
                        <h4 class="mb-1" id="totalTerms">0</h4>
                        <small class="text-muted">Terminos</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card card">
                    <div class="card-body text-center">
                        <i class="fas fa-hdd fa-2x text-info mb-2"></i>
                        <h4 class="mb-1" id="indexSize">0 MB</h4>
                        <small class="text-muted">Tamaño de Index</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card card">
                    <div class="card-body text-center">
                        <button class="btn btn-outline-primary w-100" onclick="finalizeIndex()">
                            <i class="fas fa-cogs me-2"></i>
                            Finalizar Index
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <!-- Search Section -->
            <div class="col-lg-8">
                <div class="search-card card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col">
                                <input 
                                    type="text" 
                                    class="form-control search-input" 
                                    id="searchInput"
                                    placeholder="Enter your search query..."
                                    onkeypress="if(event.key==='Enter') performSearch()"
                                >
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-search btn-primary" onclick="performSearch()">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Search Results -->
                <div id="searchResults"></div>
            </div>

            <!-- Sidebar -->
            <div class="col-lg-4">
                <!-- Quick Examples -->
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h6 class="mb-0">Quick Search Examples</h6>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-secondary btn-sm" onclick="setQuery('Ciberseguridad')">Ciberseguridad</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="setQuery('Arquitectura de Computadoras')">Arquitectura de Computadoras</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="setQuery('Privacidad')">Privacidad</button>
                        </div>
                    </div>
                </div>

                <!-- Upload Section -->
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h6 class="mb-0">
                            <i class="fas fa-upload me-2"></i>
                            Subir documento
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="upload-area">
                            <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>
                            <p class="mb-3">Subir un archivo de texto</p>
                            <input type="file" class="form-control mb-3" id="fileInput" accept=".txt,.md,.csv">
                            <button class="btn btn-primary" onclick="uploadFile()">
                                <i class="fas fa-upload me-2"></i>
                                Subir archivo
                            </button>
                        </div>
                        
                        <hr>
                        
                        <textarea 
                            class="form-control mb-3" 
                            id="textContent" 
                            rows="4" 
                            placeholder="Or paste text content here..."
                        ></textarea>
                        <input 
                            type="text" 
                            class="form-control mb-3" 
                            id="fileName" 
                            placeholder="Filename (optional)"
                        >
                        <button class="btn btn-success w-100" onclick="uploadText()">
                            <i class="fas fa-plus me-2"></i>
                            Agregar archivo de texto
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="toastContainer"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Main JavaScript -->
    <script>
        const API_BASE = 'http://localhost:8001';
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            checkAPIConnection();
        });

        // Check if API is accessible
        async function checkAPIConnection() {
            try {
                const response = await fetch(`${API_BASE}/`);
                if (response.ok) {
                    showToast('API Connected', 'Connected to Text Search API successfully!', 'success');
                } else {
                    showToast('API Warning', 'API returned an error. Please check if the server is running.', 'warning');
                }
            } catch (error) {
                showToast('API Error', 'Cannot connect to API. Make sure the server is running on port 8001.', 'danger');
            }
        }

        // Load index statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/index/stats`);
                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('totalDocs').textContent = stats.total_documents;
                    document.getElementById('totalTerms').textContent = stats.total_terms;
                    document.getElementById('indexSize').textContent = stats.index_size_mb + ' MB';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Set search query
        function setQuery(query) {
            document.getElementById('searchInput').value = query;
        }

        // Perform search
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '<div class="text-center"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-2">Searching...</p></div>';

            try {
                const startTime = Date.now();
                const response = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, k: 10 })
                });

                if (response.ok) {
                    const data = await response.json();
                    const searchTime = Date.now() - startTime;
                    displaySearchResults(data.results, query, searchTime);
                    showToast('Search Complete', `Found ${data.total_found} results in ${data.search_time_ms}ms!`, 'success');
                } else {
                    throw new Error('Search failed');
                }
            } catch (error) {
                resultsContainer.innerHTML = '<div class="alert alert-danger">Search failed. Please try again.</div>';
                showToast('Search Error', 'Search failed. Please try again.', 'danger');
            }
        }

        // Display search results
        function displaySearchResults(results, query, searchTime) {
            const container = document.getElementById('searchResults');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <h6>No results found for "${query}"</h6>
                        <p class="mb-0">Try different keywords or upload more documents.</p>
                    </div>
                `;
                return;
            }

            let html = `<h5 class="mb-3">Search Results for "${query}"</h5>`;
            
            results.forEach((result, index) => {
                const similarity = (result.similarity_score * 100).toFixed(1);
                html += `
                    <div class="result-card card fade-in" style="animation-delay: ${index * 0.1}s">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="mb-1">
                                    <i class="fas fa-file-alt me-2 text-primary"></i>
                                    ${result.filename}
                                </h6>
                                <span class="badge similarity-badge text-white">
                                    <i class="fas fa-star me-1"></i>
                                    ${similarity}%
                                </span>
                            </div>
                            <p class="text-muted mb-2">${result.text_preview}</p>
                            <small class="text-muted">
                                <i class="fas fa-clock me-1"></i>
                                ${result.created_at || 'Unknown date'}
                            </small>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // Upload text content
        async function uploadText() {
            const text = document.getElementById('textContent').value.trim();
            const filename = document.getElementById('fileName').value.trim() || 'document.txt';
            
            if (!text) {
                showToast('Upload Error', 'Please enter some text content.', 'warning');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/upload-text`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        filename: filename,
                        metadata: { uploaded_via: 'web_demo', type: 'text' }
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    showToast('Upload Success', `Document "${data.filename}" uploaded successfully!`, 'success');
                    document.getElementById('textContent').value = '';
                    document.getElementById('fileName').value = '';
                    loadStats();
                } else {
                    throw new Error('Upload failed');
                }
            } catch (error) {
                showToast('Upload Error', 'Upload failed. Please try again.', 'danger');
            }
        }

        // Upload file
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showToast('Upload Error', 'Please select a file.', 'warning');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/upload-file`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    showToast('Upload Success', `File "${data.filename}" uploaded successfully!`, 'success');
                    fileInput.value = '';
                    loadStats();
                } else {
                    throw new Error('File upload failed');
                }
            } catch (error) {
                showToast('Upload Error', 'File upload failed. Please try again.', 'danger');
            }
        }

        // Finalize index
        async function finalizeIndex() {
            try {
                const response = await fetch(`${API_BASE}/finalize-index`, {
                    method: 'POST'
                });

                if (response.ok) {
                    showToast('Index Finalized', 'Index finalized successfully!', 'success');
                    loadStats();
                } else {
                    throw new Error('Finalization failed');
                }
            } catch (error) {
                showToast('Finalization Error', 'Finalization failed. Please try again.', 'danger');
            }
        }

        // Show toast notification
        function showToast(title, message, type = 'info') {
            const toastId = 'toast-' + Date.now();
            const toastHtml = `
                <div class="toast" id="${toastId}" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header bg-${type} text-white">
                        <i class="fas fa-info-circle me-2"></i>
                        <strong class="me-auto">${title}</strong>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body">
                        ${message}
                    </div>
                </div>
            `;
            
            document.getElementById('toastContainer').insertAdjacentHTML('beforeend', toastHtml);
            
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { autohide: true, delay: 5000 });
            toast.show();
            
            // Remove toast element after it's hidden
            toastElement.addEventListener('hidden.bs.toast', function() {
                toastElement.remove();
            });
        }
    </script>
</body>
</html>
